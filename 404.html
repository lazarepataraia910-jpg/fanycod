<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>გვერდი ვერ მოიძებნა — CodeQuest</title>
<meta name="description" content="ეს გვერდი არ არსებობს. დაბრუნდი CodeQuest-ის მთავარ გვერდზე ან გააგრძელე თამაში.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3d5afe">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#1b1f2e;--muted:#5b6478;--border:#e1e5ef;--accent:#3d5afe}
@media (prefers-color-scheme:dark){:root{--bg:#121520;--panel:#1b1f2e;--text:#eef1f8;--muted:#9aa3b8;--border:#2c3346}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;display:grid;place-items:center;min-height:100vh;padding:24px 16px;background:radial-gradient(60% 45% at 85% 0,rgba(124,77,255,.16),transparent 70%),radial-gradient(50% 40% at 0 100%,rgba(61,90,254,.14),transparent 70%),var(--bg);color:var(--text);font:16px/1.6 "Noto Sans Georgian",system-ui,sans-serif}
.box{width:100%;max-width:520px;text-align:center}
.sky{position:relative;overflow:hidden;isolation:isolate;padding:34px 20px 26px;border-radius:28px;color:#fff;background:radial-gradient(circle at 80% 20%,rgba(151,117,250,.5),transparent 45%),radial-gradient(circle at 5% 110%,rgba(61,90,254,.55),transparent 50%),linear-gradient(140deg,#131735,#221a50 55%,#2c1452);box-shadow:0 24px 50px -24px rgba(34,26,80,.75)}
.sky::before{content:'';position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.6px);background-size:22px 22px}
.code{font:800 clamp(4.2rem,20vw,6.5rem)/1 ui-monospace,Consolas,monospace;letter-spacing:-.04em;background:linear-gradient(90deg,#ffe066,#ff922b);-webkit-background-clip:text;background-clip:text;color:transparent}
.bit{width:110px;height:130px;margin:6px auto 0;animation:float 3.6s ease-in-out infinite}
.bit svg{width:100%;height:100%;display:block;filter:drop-shadow(0 14px 14px rgba(0,0,0,.4))}
.q{position:absolute;top:168px;left:calc(50% + 50px);padding:4px 10px;border-radius:12px 12px 12px 4px;background:#fff;color:#2b1d63;font-weight:800;animation:float 3s ease-in-out infinite}
h1{margin:18px 0 4px;font-size:1.45rem}
p{margin:0 auto;max-width:400px;color:rgba(255,255,255,.78)}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:800;text-decoration:none}
.btn.play{background:linear-gradient(180deg,#ffe066,#fcc419);color:#3d2a00;box-shadow:0 5px 0 #d49b00}
.btn.ghost{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff}
.btn:hover{filter:brightness(1.05)}
.foot{margin-top:16px;color:var(--muted);font-size:.85rem}
.foot a{color:inherit}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- Vercel Web Analytics -->
<script>if (location.protocol === 'https:') { window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); }; var s = document.createElement('script'); s.defer = true; s.src = '/_vercel/insights/script.js'; document.head.appendChild(s); }</script>
</head>
<body>
<main class="box">
  <div class="sky">
    <div class="code" aria-hidden="true">404</div>
    <div class="bit" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -3 12 16" shape-rendering="crispEdges"><rect x="5.6" y="0.6" width=".8" height="2.6" fill="#13163a"/><circle cx="6" cy="0.5" r="0.95" fill="#ff8a00"/><rect x="2" y="3" width="8" height="6" rx="1" fill="#3d5afe"/><rect x="3" y="4" width="6" height="3.4" rx=".5" fill="#13163a"/><rect x="4" y="5.3" width="1.2" height=".5" fill="#3ddc97"/><rect x="6.8" y="5.3" width="1.2" height=".5" fill="#3ddc97"/><rect x="5" y="7.8" width="2" height=".5" fill="#13163a"/><rect x="1.1" y="5" width=".9" height="2.2" fill="#13163a"/><rect x="10" y="5" width=".9" height="2.2" fill="#13163a"/><rect x="3" y="9" width="6" height="2.2" fill="#13163a"/><rect x="4.4" y="9.6" width="3.2" height=".9" fill="#3d5afe"/><rect x="2.4" y="11.2" width="2.8" height="1.4" rx=".5" fill="#2d3436"/><rect x="6.8" y="11.2" width="2.8" height="1.4" rx=".5" fill="#2d3436"/></svg></div>
    <span class="q" aria-hidden="true">?!</span>
    <h1>ბიტი აქ დაიკარგა</h1>
    <p>ეს გვერდი არ არსებობს — შეიძლება ბმული შეიცვალა ან მისამართი შეცდომით ჩაიწერა.</p>
    <div class="btns">
      <a class="btn play" href="/CodeQuest.html">▶ თამაშზე დაბრუნება</a>
      <a class="btn ghost" href="/?home">🏠 მთავარი გვერდი</a>
    </div>
  </div>
  <p class="foot">CodeQuest © <span id="year">2026</span> · <a href="/privacy.html">კონფიდენციალურობა</a> · <a href="/terms.html">წესები</a></p>
</main>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
