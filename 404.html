<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>გვერდი ვერ მოიძებნა — CodeQuest</title>
<meta name="description" content="ეს გვერდი არ არსებობს. დაბრუნდი CodeQuest-ის მთავარ გვერდზე ან გააგრძელე თამაში.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700;800&display=swap"></noscript>
<style>
:root{--bg:#ffffff;--panel:#ffffff;--soft:#f6f7fb;--text:#0f1222;--muted:#5d6479;--border:#e7e9f0;--accent:#3d5afe}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;display:grid;place-items:center;min-height:100vh;padding:24px 16px;background:var(--bg);color:var(--text);font:16px/1.6 "Noto Sans Georgian",system-ui,sans-serif}
.box{width:100%;max-width:520px;text-align:center}
.sky{position:relative;padding:34px 20px 30px;border-radius:24px;background:var(--soft);border:1px solid var(--border)}
.code{font:800 clamp(4.2rem,20vw,6.5rem)/1 ui-monospace,Consolas,monospace;letter-spacing:-.04em;color:var(--accent)}
.bit{width:110px;height:130px;margin:6px auto 0;animation:float 3.6s ease-in-out infinite}
.bit svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 10px rgba(15,18,34,.18))}
.q{position:absolute;top:168px;left:calc(50% + 50px);padding:4px 10px;border-radius:12px 12px 12px 4px;background:var(--accent);color:#fff;font-weight:800;animation:float 3s ease-in-out infinite}
h1{margin:18px 0 4px;font-size:1.45rem}
p{margin:0 auto;max-width:400px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:700;text-decoration:none}
.btn.play{background:var(--accent);color:#fff}
.btn.ghost{border:1px solid var(--border);background:var(--bg);color:var(--text)}
.btn:hover{filter:brightness(1.05)}
.foot{margin-top:16px;color:var(--muted);font-size:.85rem}
.foot a{color:inherit}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- Vercel Web Analytics -->
<script>if (location.protocol === 'https:') { window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); }; var s = document.createElement('script'); s.defer = true; s.src = '/_vercel/insights/script.js'; document.head.appendChild(s); window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); }; var t = document.createElement('script'); t.defer = true; t.src = '/_vercel/speed-insights/script.js'; document.head.appendChild(t); }</script>
</head>
<body>
<main class="box">
  <div class="sky">
    <div class="code" aria-hidden="true">404</div>
    <div class="bit" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -3 12 16" shape-rendering="crispEdges"><rect x="5.6" y="0.6" width=".8" height="2.6" fill="#13163a"/><circle cx="6" cy="0.5" r="0.95" fill="#ff8a00"/><rect x="2" y="3" width="8" height="6" rx="1" fill="#3d5afe"/><rect x="3" y="4" width="6" height="3.4" rx=".5" fill="#13163a"/><rect x="4" y="5.3" width="1.2" height=".5" fill="#3ddc97"/><rect x="6.8" y="5.3" width="1.2" height=".5" fill="#3ddc97"/><rect x="5" y="7.8" width="2" height=".5" fill="#13163a"/><rect x="1.1" y="5" width=".9" height="2.2" fill="#13163a"/><rect x="10" y="5" width=".9" height="2.2" fill="#13163a"/><rect x="3" y="9" width="6" height="2.2" fill="#13163a"/><rect x="4.4" y="9.6" width="3.2" height=".9" fill="#3d5afe"/><rect x="2.4" y="11.2" width="2.8" height="1.4" rx=".5" fill="#2d3436"/><rect x="6.8" y="11.2" width="2.8" height="1.4" rx=".5" fill="#2d3436"/></svg></div>
    <span class="q" aria-hidden="true">?!</span>
    <h1>ბიტი აქ დაიკარგა</h1>
    <p>ეს გვერდი არ არსებობს — შეიძლება ბმული შეიცვალა ან მისამართი შეცდომით ჩაიწერა.</p>
    <div class="btns">
      <a class="btn play" href="/CodeQuest.html">▶ თამაშზე დაბრუნება</a>
      <a class="btn ghost" href="/?home">🏠 მთავარი გვერდი</a>
    </div>
  </div>
  <p class="foot">CodeQuest © <span id="year">2026</span> · <a href="/privacy.html">კონფიდენციალურობა</a> · <a href="/terms.html">წესები</a></p>
</main>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
