<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ანგარიში — CodeQuest</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#3d5afe">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#1b1f2e;--muted:#5b6478;--border:#e1e5ef;--accent:#3d5afe;--bad:#d93a3a;--good:#1f9d55}
@media (prefers-color-scheme:dark){:root{--bg:#121520;--panel:#1b1f2e;--text:#eef1f8;--muted:#9aa3b8;--border:#2c3346;--bad:#ff6b6b;--good:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Noto Sans Georgian",system-ui,sans-serif}
a{color:var(--accent)}
header{background:linear-gradient(135deg,#2b3bab,#3d5afe 55%,#5f3dc4)}
.bar{max-width:820px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar a{color:#fff;font-weight:800;text-decoration:none}
main{max-width:440px;margin:40px auto;padding:28px 24px;background:var(--panel);border:1px solid var(--border);border-radius:18px;text-align:center}
@media (max-width:480px){main{margin:16px;padding:22px 16px}}
.ic{font-size:2.6rem;line-height:1}
h1{margin:8px 0 6px;font-size:1.5rem;line-height:1.3}
.muted{color:var(--muted)}
form{display:grid;gap:12px;margin-top:18px;text-align:left}
label{display:grid;gap:4px;font-weight:700;font-size:.95rem}
label small{font-weight:400;color:var(--muted)}
input{font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-block;font:inherit;font-weight:800;padding:11px 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);min-height:1.2em;margin:0;font-size:.95rem}
.ok{color:var(--good)}
.go{margin-top:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="bar"><a href="./?home">← CodeQuest</a><a href="CodeQuest.html">თამაში ▶</a></div></header>
<main id="box" aria-live="polite"><p class="muted">იტვირთება…</p></main>
<script>
// ბმულები წერილებიდან: ?reset=კოდი — ახალი პაროლი, ?verify=კოდი — ელფოსტის დადასტურება.
// გვერდი სესიას არ ქმნის და თამაშის cookie-ს არ ეხება (სხვა ანგარიშით შესული თამაში სხვის ანგარიშზე არ გადაერთვება)
(() => {
  const ERR = {
    offline: 'სერვერთან კავშირი ვერ დამყარდა. შეამოწმე ინტერნეტი.',
    pass_short: 'პაროლი მინიმუმ 8 სიმბოლო უნდა იყოს.',
    pass_long: 'პაროლი ძალიან გრძელია.',
    pass_name: 'პაროლი სახელს არ უნდა ემთხვეოდეს.',
    pass_common: 'ეს პაროლი ძალიან მარტივია და ადვილად გამოსაცნობია — მოიფიქრე სხვა (მაგ. სიტყვები და ციფრები ერთად).',
    pass_match: 'პაროლები ერთმანეთს არ ემთხვევა.',
    bad_login: 'სახელი ან პაროლი არასწორია.',
    bad_link: 'ბმული არასწორია, უკვე გამოყენებულია ან ვადა გაუვიდა. მოითხოვე ახალი.',
    other_account: 'ეს ბმული სხვა ანგარიშისთვისაა. თამაშში გამოდი და შედი იმ ანგარიშით, რომელსაც ელფოსტა მიაბი, ან ქვემოთ ჩაწერე მისი სახელი და პაროლი.',
    rate_limited: 'ძალიან ბევრი მცდელობა. დაისვენე რამდენიმე წუთი და თავიდან სცადე.',
    server: 'სერვერზე შეცდომა მოხდა. სცადე ცოტა ხანში.'
  };
  const msg = r => ERR[r.error] || ERR.server;
  const box = document.getElementById('box');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const api = async (action, data) => {
    try {
      const r = await fetch('/api/account', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action }, data)) });
      return await r.json().catch(() => ({ ok: false, error: 'server' }));
    } catch (e) { return { ok: false, error: 'offline' }; }
  };
  const show = (ic, title, text, html) => { box.innerHTML = '<div class="ic" aria-hidden="true">' + ic + '</div><h1>' + esc(title) + '</h1>' + (text ? '<p class="muted">' + esc(text) + '</p>' : '') + (html || ''); };
  const toGame = (label, login) => '<p class="go"><a class="btn" href="CodeQuest.html' + (login ? '?login=1' : '') + '">' + label + '</a></p>';
  const field = (label, name, type, ac, hint) => '<label>' + label + (hint ? ' <small>' + hint + '</small>' : '') + '<input name="' + name + '" type="' + type + '" autocomplete="' + ac + '" required maxlength="' + (name === 'name' ? 40 : 200) + '"></label>';
  // ფორმა: check — კლიენტის შემოწმება (შეცდომის კოდი ან null), send — მოთხოვნა, done — წარმატება
  const form = (fields, button, check, send, done) => {
    box.insertAdjacentHTML('beforeend', '<form novalidate>' + fields + '<p class="err" role="alert"></p><button class="btn" type="submit">' + button + '</button></form>');
    const f = box.querySelector('form'), err = f.querySelector('.err'), b = f.querySelector('button');
    f.querySelector('input').focus();
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const v = Object.fromEntries(new FormData(f)), bad = check(v);
      if (bad) { err.textContent = ERR[bad]; return; }
      b.disabled = true; err.textContent = '';
      const r = await send(v);
      b.disabled = false;
      if (r.ok) done(r); else err.textContent = msg(r);
    });
  };

  // კოდი მისამართიდან მაშინვე ქრება (ისტორია, სკრინშოტი); გვერდის განახლებისთვის ჩანართის მეხსიერებაში რჩება
  const q = new URLSearchParams(location.search), CODE = /^[A-Za-z0-9_-]{20,100}$/;
  let mode = q.has('reset') ? 'reset' : q.has('verify') ? 'verify' : '', code = mode ? q.get(mode) : '';
  if (mode) { history.replaceState(null, '', location.pathname); try { sessionStorage.setItem('cq.link', JSON.stringify([mode, code])); } catch (e) { } }
  else { try { [mode, code] = JSON.parse(sessionStorage.getItem('cq.link')) || ['', '']; } catch (e) { } }
  const used = () => { try { sessionStorage.removeItem('cq.link'); } catch (e) { } };
  if (!mode || !CODE.test(code || '')) return show('🔗', 'ბმული არასწორია', 'გახსენი ბმული წერილიდან ისე, როგორც არის, ან თამაშში მოითხოვე ახალი.', toGame('თამაშზე გადასვლა'));

  if (mode === 'reset') {
    show('🔑', 'ახალი პაროლი', 'მოიფიქრე ახალი პაროლი. შეცვლის შემდეგ ყველა მოწყობილობაზე თავიდან შესვლა მოგიწევს.');
    form(field('ახალი პაროლი', 'password', 'password', 'new-password', 'მინიმუმ 8 სიმბოლო') + field('გაიმეორე ახალი პაროლი', 'password2', 'password', 'new-password'), 'პაროლის შეცვლა',
      v => (v.password.length < 8 ? 'pass_short' : v.password !== v.password2 ? 'pass_match' : null),
      v => api('resetLink', { code, password: v.password, nologin: true }),
      r => { used(); show('✅', 'პაროლი შეიცვალა', 'ახლა თამაშში შედი სახელით „' + r.name + '“ და ახალი პაროლით.', toGame('თამაშში შესვლა', true)); });
    return;
  }

  // ელფოსტის დადასტურება: ჯერ თამაშის სესიით (ამ ბრაუზერში შესული ხარ), თორემ — სახელი და პაროლი
  const verified = () => { used(); show('✅', 'ელფოსტა დადასტურდა', 'თუ პაროლი დაგავიწყდება, აღდგენის ბმულს ამ ელფოსტაზე მიიღებ.', toGame('თამაშზე გადასვლა')); };
  const ask = text => {
    show('✉️', 'ელფოსტის დადასტურება', text);
    form(field('სახელი', 'name', 'text', 'username') + field('პაროლი', 'password', 'password', 'current-password'), 'დადასტურება',
      v => (v.name.trim() && v.password ? null : 'bad_login'),
      v => api('verifyEmail', { code, name: v.name.trim(), password: v.password }), verified);
  };
  api('verifyEmail', { code }).then(r => {
    if (r.ok) return verified();
    if (r.error === 'no_session') return ask('ჩაწერე იმ ანგარიშის სახელი და პაროლი, რომელსაც ეს ელფოსტა მიაბი.');
    if (r.error === 'other_account') return ask(ERR.other_account);
    show('⚠️', 'ელფოსტა ვერ დადასტურდა', msg(r), toGame('თამაშზე გადასვლა'));
  });
})();
</script>
</body>
</html>
